# ─── JDK 17 (Eclipse Temurin 17.0.20) ───────────────────────────────────────
org.gradle.java.home=C:\\Users\\annes\\.jdks\\temurin-17.0.20

# ─── Gradle JVM heap / metadata ──────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ─── Gradle build-cache & parallel execution ─────────────────────────────────
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# ─── AndroidX & Jetifier ──────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true
android.r8.fullMode=false

# ─── Kotlin / kapt incremental ───────────────────────────────────────────────
kotlin.incremental=false
kapt.use.worker.api=true
