<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F141C" />
    </radialGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="50%" stop-color="#8E44AD" />
      <stop offset="100%" stop-color="#00D2D3" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Cozy Arch (The Nook) -->
  <path d="M156 360V236C156 180.77 200.77 136 256 136C311.23 136 356 180.77 356 236V360" 
        stroke="url(#neonGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Inner Minimal Clock Hands (The Time) -->
  <path d="M256 210V256L298 278" 
        stroke="url(#neonGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Ambient Center Dot -->
  <circle cx="256" cy="256" r="10" fill="#00D2D3" />
</svg>
